# ============== Acados Options ============== #
b_acados_generation: false  # true: generate acados json, c code
                            # false: do not generate acados json, c code

T: 80                       # Time horizon steps
dt: 0.1                     # Time step duration [s]

# ============ Vehicle Params ============ ##
width: 2.297                   # [m] Vehicle width
length: 5.176                  # [m] Vehicle length
wheel_base: 3.089              # [m] Vehicle wheelbase
rear_axle_to_front: 4.049      # [m] Distance from rear axle to front
rear_axle_to_rear: 1.127       # [m] Distance from rear axle to rear
max_delta  : 60.0              # [deg]       # (9) State Constraint: Max delta
max_ddelta: 28.647             # [deg/s]       # (7) Input Constraint


# ============ Constraints Params ============ #
# === Nuplan Comfort Metric Criterea
nuplan_max_abs_mag_jerk:  8.37         # [m/s^3]     # (1) Total Jerk Constraint Metric
nuplan_max_abs_lat_accel: 4.89         # [m/s^2]     # (2) Lageral Acceleration Metric
nuplan_max_lon_accel:     2.40         # [m/s^2]     # (3) Max longitudinal Acceleration
nuplan_min_lon_accel:     -4.05        # [m/s^2]     # (4) Min Longitudinal Acceleration
nuplan_max_abs_yaw_accel: 1.93         # [rad/s^2]   # (5) Max Yaw Acceleration
nuplan_max_abs_lon_jerk:  4.13         # [m/s^3]     # (5) Max Longitudinal Jerk # 4.13
nuplan_max_abs_yaw_rate:  0.95         # [rad/s]     # (6) Max Yaw rate

# === tanh function parameters
tanh_gain: 4.0

# === Nuplan Comfort Metric Criterea
safety_margin: 0.3              # [m]        # 0.25
boundary_margin: 0.1           # [m]        # 0.1
boundary_lim_time: 1.5           # [int, step]
safety_distance_pedestrian: 2.1 # [m]         # (8) Safety Distance


# === MinMax Constraints Info === #
max_lon_accel:     5.40          # [m/s^2]
min_lon_accel:     -7.40         # [m/s^2]
max_abs_lat_accel: 5.00          # [m/s^2]
max_abs_lon_jerk:  8.37          # [m/s^3]

# === Tracking Cost
# Set (states + inputs)
Q_x          : 0.35
Q_y          : 0.35
Q_yaw        : 0.35   # heading 감쇠. 2026-08-03 0.00 → 0.35 (오버슈트 대책)
Q_vel        : 0.00

Qe_x         : 0.0
Qe_y         : 0.0
Qe_yaw       : 0.0
Qe_vel       : 0.0

# === Input Cost
R_jerk    : 0.2 # 0.2
R_ddelta  : 0.01

# === Normalization Term, Max Error Criterea
N_x       : 8.0     # m # 8
N_y       : 8.0     # m # 2
N_yaw     : 0.1745  # rad, 15 deg
N_vel     : 1.0    # m/s

N_jerk    : 8.37    # m/s^3
N_ddelta  : 0.5     # deg
# ============ ================== ============ #

# ============ Kernel-Based Cost Parameters ============ #
# kernel = (tanh(a*error² + b) + 1) / 2, range: [0, 1]
# a: steepness, b: shift (error² where cost=0.5 is at -b/a)

kernel_scale_x: 0.863344         # [1/m²]
kernel_scale_y: 0.863344         # [1/m²]
kernel_scale_yaw: 38.371     # [1/(rad)²]  민감점 sqrt(3.453377/38.371) = 0.300 rad = 17.2°
kernel_scale_vel: 0.0        # [1/(m/s)²]
kernel_scale_jerk: 0.825180     # [1/(m/s³)²]
kernel_scale_ddelta: 13.813510     # [1/(rad/s)²]

kernel_shift_x: -3.453377
kernel_shift_y: -3.453377
kernel_shift_yaw: -3.453377
kernel_shift_vel: 0.0
kernel_shift_jerk: -3.453377
kernel_shift_ddelta: -3.453377

use_kernel_cost: 1     # 1: Use kernel cost for stage cost    | 0: do not use kernel cost
use_kernel_cost_e: 0   # 1: Use kernel cost for terminal cost | 0: do not use kernel cost
# ============ ============================= ============ #

# ============ Soft Constraints Cost ============ #
collision_check_time_s: 1.5
s_lon_jerk   : 12.0 # Input Jerk
s_lon_accel  : 1.0 # Nuplan Longitudinal Accel
s_accel      : 12.0 # Acceleration Soft Constraints
s_comfort    : 1.0 # Comfort Metric, set as 0 # 2.0
s_col        : 12.0 # Collision Soft Constraints
s_boundary   : 12.0 # Boundary Soft Constraints
# ============ ===================== ============ #
